pluginManagement {
    repositories {
        maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.neoforged.gradle.userdev' && requested.version != null) {
                useModule("net.neoforged.gradle:userdev:${requested.version}")
            }
        }
    }
}

rootProject.name = 'bbs-together-addon'
