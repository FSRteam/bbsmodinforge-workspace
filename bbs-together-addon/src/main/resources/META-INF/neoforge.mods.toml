modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "McHorse, ChillinWithDylan"
description = '''Multiplayer Film collaboration, synchronized recording, replay locking, and asset synchronization for BBSFSR.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "bbs"
type = "required"
versionRange = "[${bbs_version},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "bbs_together.mixins.json"

[[mixins]]
config = "bbs_together.client.mixins.json"
